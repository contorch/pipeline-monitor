[project]
name = "pipeline-monitor"
version = "0.4.0"
description = "macOS menu bar app for observing the meeting-capture + context-orchestrator pipeline"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Inside Contorch.app: notifications through UNUserNotificationCenter.
app = ["pyobjc-framework-UserNotifications; sys_platform == 'darwin'"]
dev = ["pytest"]

[project.scripts]
pipeline-monitor = "pipeline_monitor.app:main"
contorch = "pipeline_monitor.contorch:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline_monitor*"]

[project]
name = "pipeline-monitor"
version = "0.4.0"
description = "macOS menu bar app for observing the meeting-capture + context-orchestrator pipeline"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
]

[project.optional-dependencies]
# Inside Contorch.app: notifications through UNUserNotificationCenter, and
# Open at Login through SMAppService.mainApp (loginitem.py). Sparkle needs no
# extra: updates.py loads the app's own Sparkle.framework with pyobjc-core.
app = [
    "pyobjc-framework-UserNotifications; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement; sys_platform == 'darwin'",
]
dev = ["pytest"]

[project.scripts]
pipeline-monitor = "pipeline_monitor.app:main"
contorch = "pipeline_monitor.contorch:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline_monitor*"]

[tool.setuptools.package-data]
# The menu bar icons (loaded with importlib.resources; tests/test_wheel.py).
pipeline_monitor = ["assets/*.png"]
